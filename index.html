<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monpetitsugarlove.com est à vendre</title>
  <meta name="description" content="Le domaine monpetitsugarlove.com est à vendre. Contactez-nous pour faire une offre.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec 0%, #fdf2f8 50%, #f3e8ff 100%);
      color: #2d1b2e;
    }

    .card {
      background: #fff;
      max-width: 560px;
      width: 100%;
      padding: 56px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(190, 24, 93, 0.12);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: #fce7f3;
      color: #be185d;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .domain {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 800;
      word-break: break-word;
      background: linear-gradient(90deg, #db2777, #9333ea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 18px;
      color: #6b5a6e;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 14px;
      background: linear-gradient(90deg, #db2777, #9333ea);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(219, 39, 119, 0.4);
    }

    .email {
      display: block;
      margin-top: 18px;
      font-size: 14px;
      color: #9a8a9c;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #b5a6b7;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Domaine à vendre · For sale</span>

    <h1 class="domain">monpetitsugarlove.com</h1>

    <p class="subtitle">
      Ce nom de domaine est disponible à l'achat.<br>
      This domain name is available for purchase.
    </p>

    <a class="btn" href="mailto:constipanda1@gmail.com?subject=Offre%20pour%20monpetitsugarlove.com">
      Faire une offre / Make an offer
    </a>

    <span class="email">constipanda1@gmail.com</span>

    <footer>© 2026 monpetitsugarlove.com</footer>
  </main>
</body>
</html>
